<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<h3>Face-API 测试</h3>
<p id="status">加载中...</p>
<script src="face-api.min.js"></script>
<script>
var s=document.getElementById('status');
s.textContent='face-api.js 已加载, faceapi='+(typeof faceapi);
if(typeof faceapi==='undefined'){s.textContent+=' ❌ faceapi未定义!';}else{
  s.textContent+=' ✅ 开始加载模型...';
  faceapi.nets.ssdMobilenetv1.load('./models/').then(function(){
    s.textContent+=' SSD ✅ 加载68点...';
    return faceapi.nets.faceLandmark68Net.load('./models/');
  }).then(function(){
    s.textContent+=' ✅ 全部模型就绪!';
  }).catch(function(e){
    s.textContent+=' ❌ 错误: '+e.message;
  });
}
</script>
</body></html>
