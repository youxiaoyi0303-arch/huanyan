<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>项目管理工具包</title>
<style>
:root{
  --bg:#F5F4F1;--card:#FFFFFF;--text:#1E1E1E;--textM:#6B6B6B;--textL:#9B9B9B;
  --border:#E8E4DF;--accent:#3370FF;--accentL:#E1EAFF;--red:#F54A45;--orange:#FF8C42;
  --green:#34C759;--yellow:#FFB800;--purple:#AF52DE;--teal:#5AC8FA;
  --shadow:0 1px 3px rgba(0,0,0,0.06);--shadowL:0 4px 12px rgba(0,0,0,0.08);
  --radius:10px;--radiusS:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
/* 侧边栏 */
aside{width:220px;background:var(--card);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;flex-shrink:0}
aside .logo{padding:0 20px 20px;font-size:18px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);margin-bottom:8px}
aside .logo span{color:var(--accent)}
aside nav{flex:1;padding:4px 10px}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radiusS);color:var(--textM);text-decoration:none;font-size:14px;margin-bottom:2px;transition:all .15s}
aside nav a:hover{background:var(--bg);color:var(--text)}
aside nav a.active{background:var(--accentL);color:var(--accent);font-weight:600}
aside nav a .icon{font-size:18px;width:24px;text-align:center}
aside .user{padding:16px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:13px;color:var(--textM)}
aside .user .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
/* 主区域 */
main{flex:1;overflow-y:auto;padding:24px 28px}
.page{display:none}
.page.active{display:block}
h1{font-size:22px;margin-bottom:20px}
h2{font-size:16px;margin-bottom:12px;color:var(--text)}
h3{font-size:14px;margin-bottom:8px}
/* 仪表盘卡片 */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--textM);margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700}
.stat-card .sub{font-size:12px;color:var(--textL);margin-top:4px}
/* 表格 */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
th,td{padding:10px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--border)}
th{background:#FAFAF8;font-weight:600;color:var(--textM);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
td{color:var(--text)}
tr:hover td{background:#FAFAF8}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-blue{background:var(--accentL);color:var(--accent)}
.badge-green{background:#E3F9E9;color:var(--green)}
.badge-red{background:#FFE8E7;color:var(--red)}
.badge-orange{background:#FFF2E4;color:var(--orange)}
.badge-purple{background:#F2E5FA;color:var(--purple)}
.badge-yellow{background:#FFF8E0;color:#B8860B}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radiusS);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#2B5FD9}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{color:var(--red);border-color:#FFD0CF}
.btn-danger:hover{background:#FFF0EF}
/* 看板 */
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.kanban-col{min-width:260px;max-width:300px;flex-shrink:0;background:var(--bg);border-radius:var(--radius);padding:12px}
.kanban-col h3{font-size:13px;font-weight:600;margin-bottom:10px;padding:0 4px;display:flex;justify-content:space-between;align-items:center}
.kanban-col h3 .count{font-size:11px;color:var(--textL);font-weight:400}
.kanban-item{background:var(--card);border-radius:var(--radiusS);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:grab;font-size:13px;transition:box-shadow .15s}
.kanban-item:hover{box-shadow:var(--shadowL)}
.kanban-item .item-title{font-weight:600;margin-bottom:4px}
.kanban-item .item-meta{font-size:11px;color:var(--textL);display:flex;gap:8px;align-items:center;margin-top:6px}
.kanban-item .item-priority{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-high{background:var(--red)}.p-medium{background:var(--orange)}.p-low{background:var(--green)}
/* 甘特图 */
.gantt-area{overflow-x:auto;background:var(--card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);border:1px solid var(--border)}
.gantt-row{display:flex;align-items:center;height:38px;border-bottom:1px solid var(--bg);position:relative}
.gantt-row:last-child{border-bottom:none}
.gantt-label{width:200px;font-size:12px;padding-right:12px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{flex:1;position:relative;height:24px;background:var(--bg);border-radius:4px;overflow:hidden}
.gantt-bar{position:absolute;height:100%;border-radius:4px;top:0;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden}
.gantt-header{display:flex;margin-left:200px;margin-bottom:6px}
.gantt-month{flex:1;text-align:center;font-size:10px;color:var(--textL);padding:2px 0}
/* 待办 */
.todo-input{display:flex;gap:10px;margin-bottom:16px}
.todo-input input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radiusS);font-size:14px;outline:none;font-family:inherit}
.todo-input input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentL)}
.todo-list{list-style:none}
.todo-list li{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-radius:var(--radiusS);margin-bottom:6px;border:1px solid var(--border);font-size:14px;transition:all .15s}
.todo-list li.done{opacity:.5;text-decoration:line-through}
.todo-list li input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.todo-list li .text{flex:1}
.todo-list li .del{color:var(--textL);cursor:pointer;font-size:18px;padding:0 4px}
.todo-list li .del:hover{color:var(--red)}
/* 知识库 */
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kb-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.kb-card:hover{box-shadow:var(--shadowL);transform:translateY(-1px)}
.kb-card .kb-icon{font-size:28px;margin-bottom:8px}
.kb-card h3{font-size:15px;margin-bottom:4px}
.kb-card p{font-size:12px;color:var(--textM);line-height:1.5}
/* 弹窗 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:70vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.15)}
.modal h2{margin-bottom:16px}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:12px;color:var(--textM);margin-bottom:4px;font-weight:600}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radiusS);font-size:13px;font-family:inherit;outline:none}
.modal .field input:focus,.modal .field select:focus,.modal .field textarea:focus{border-color:var(--accent)}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E1E1E;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
/* 搜索栏 */
.search-bar{margin-bottom:16px;display:flex;gap:10px;align-items:center}
.search-bar input{flex:1;max-width:300px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radiusS);font-size:13px;outline:none;font-family:inherit}
.search-bar input:focus{border-color:var(--accent)}
</style>
</head>
<body>
<aside>
  <div class="logo"><span>📐</span> 项目管理</div>
  <nav>
    <a href="#" data-page="dash" class="active"><span class="icon">📊</span> 仪表盘</a>
    <a href="#" data-page="projects"><span class="icon">📁</span> 项目列表</a>
    <a href="#" data-page="kanban"><span class="icon">📋</span> 任务看板</a>
    <a href="#" data-page="gantt"><span class="icon">📅</span> 甘特图</a>
    <a href="#" data-page="todos"><span class="icon">✅</span> 个人待办</a>
    <a href="#" data-page="knowledge"><span class="icon">📚</span> 知识库</a>
  </nav>
  <div class="user"><div class="avatar">管</div>管理员</div>
</aside>
<main>
  <!-- 仪表盘 -->
  <div id="dash" class="page active">
    <h1>📊 项目全局仪表盘</h1>
    <div class="dash-grid" id="dashStats"></div>
    <div class="dash-grid" style="grid-template-columns:1fr 1fr;margin-top:16px">
      <div class="stat-card"><h2>📈 项目进度概览</h2><div id="projProgress"></div></div>
      <div class="stat-card"><h2>⏰ 即将到期任务</h2><div id="dueSoon"></div></div>
    </div>
  </div>
  <!-- 项目列表 -->
  <div id="projects" class="page">
    <h1>📁 项目列表</h1>
    <div class="search-bar">
      <input placeholder="搜索项目..." id="projSearch" oninput="renderProjects()">
      <button class="btn btn-primary" onclick="openProjModal()">+ 新建项目</button>
    </div>
    <table><thead><tr><th>项目名称</th><th>状态</th><th>负责人</th><th>开始日期</th><th>截止日期</th><th>进度</th><th>操作</th></tr></thead><tbody id="projTable"></tbody></table>
  </div>
  <!-- 任务看板 -->
  <div id="kanban" class="page">
    <h1>📋 任务看板</h1>
    <div style="margin-bottom:12px">
      <select id="kanbanProj" onchange="renderKanban()" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radiusS);font-size:13px;font-family:inherit"></select>
      <button class="btn btn-primary" style="margin-left:8px" onclick="openTaskModal()">+ 新建任务</button>
    </div>
    <div class="kanban" id="kanbanBoard"></div>
  </div>
  <!-- 甘特图 -->
  <div id="gantt" class="page">
    <h1>📅 甘特图</h1>
    <div style="margin-bottom:12px">
      <select id="ganttProj" onchange="renderGantt()" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--radiusS);font-size:13px;font-family:inherit"></select>
    </div>
    <div class="gantt-area" id="ganttChart"></div>
  </div>
  <!-- 个人待办 -->
  <div id="todos" class="page">
    <h1>✅ 个人待办</h1>
    <div class="todo-input">
      <input placeholder="添加新待办..." id="todoInput" onkeypress="if(event.key==='Enter')addTodo()">
      <button class="btn btn-primary" onclick="addTodo()">添加</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </div>
  <!-- 知识库 -->
  <div id="knowledge" class="page">
    <h1>📚 项目知识库</h1>
    <div class="kb-grid" id="kbGrid"></div>
  </div>
</main>
<!-- 弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<script>
// ===== 数据存储 =====
var DATA=JSON.parse(localStorage.getItem('pmtool')||'{"projects":[],"tasks":[],"todos":[]}');
function save(){localStorage.setItem('pmtool',JSON.stringify(DATA))}

// 初始种子数据
if(!DATA.projects.length){
  var now=new Date();
  function d(n){var d=new Date(now);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]}
  DATA.projects=[
    {id:'p1',name:'官网重构',status:'进行中',owner:'张三',start:d(-14),end:d(21),desc:'公司官网从Vue2升级到Vue3'},
    {id:'p2',name:'移动端App v2',status:'规划中',owner:'李四',start:d(7),end:d(60),desc:'App大版本迭代'},
    {id:'p3',name:'数据中台建设',status:'进行中',owner:'王五',start:d(-30),end:d(45),desc:'统一数据仓库和BI'},
    {id:'p4',name:'用户增长专项',status:'已完成',owner:'赵六',start:d(-60),end:d(-3),desc:'Q2用户增长活动'}
  ];
  DATA.tasks=[
    {id:'t1',pid:'p1',name:'首页UI设计',status:'已完成',priority:'high',assignee:'张三',due:d(5)},
    {id:'t2',pid:'p1',name:'组件库迁移',status:'进行中',priority:'high',assignee:'张三',due:d(10)},
    {id:'t3',pid:'p1',name:'API对接',status:'待开始',priority:'medium',assignee:'李四',due:d(15)},
    {id:'t4',pid:'p1',name:'性能优化',status:'待开始',priority:'low',assignee:'王五',due:d(18)},
    {id:'t5',pid:'p2',name:'需求评审',status:'已完成',priority:'high',assignee:'李四',due:d(10)},
    {id:'t6',pid:'p2',name:'技术选型',status:'进行中',priority:'medium',assignee:'李四',due:d(20)},
    {id:'t7',pid:'p3',name:'数据建模',status:'进行中',priority:'high',assignee:'王五',due:d(30)},
    {id:'t8',pid:'p3',name:'ETL管道搭建',status:'待开始',priority:'medium',assignee:'赵六',due:d(40)}
  ];
  DATA.todos=[
    {id:'td1',text:'评审官网重构PRD',done:false},
    {id:'td2',text:'预约数据中台技术评审会',done:false},
    {id:'td3',text:'更新项目周报',done:true}
  ];
  save();
}

// ===== 导航 =====
document.querySelectorAll('nav a').forEach(function(a){
  a.addEventListener('click',function(e){
    e.preventDefault();
    document.querySelectorAll('nav a').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
    document.getElementById(this.dataset.page).classList.add('active');
    onPageChange(this.dataset.page);
  });
});

function onPageChange(page){
  if(page==='dash')renderDash();
  if(page==='projects')renderProjects();
  if(page==='kanban')renderKanban();
  if(page==='gantt')renderGantt();
  if(page==='todos')renderTodos();
  if(page==='knowledge')renderKB();
}

// ===== 仪表盘 =====
function renderDash(){
  var ps=DATA.projects,ts=DATA.tasks;
  var active=ps.filter(function(p){return p.status==='进行中'}).length;
  var done=ps.filter(function(p){return p.status==='已完成'}).length;
  var tasksDone=ts.filter(function(t){return t.status==='已完成'}).length;
  var tasksTotal=ts.length;
  var html='<div class="stat-card"><div class="label">📁 项目总数</div><div class="value" style="color:var(--accent)">'+ps.length+'</div></div>';
  html+='<div class="stat-card"><div class="label">🔄 进行中</div><div class="value" style="color:var(--orange)">'+active+'</div></div>';
  html+='<div class="stat-card"><div class="label">✅ 已完成</div><div class="value" style="color:var(--green)">'+done+'</div></div>';
  html+='<div class="stat-card"><div class="label">📋 任务完成率</div><div class="value" style="color:var(--purple)">'+(tasksTotal?Math.round(tasksDone/tasksTotal*100):0)+'%</div></div>';
  document.getElementById('dashStats').innerHTML=html;

  var pp='';ps.forEach(function(p){
    var pct=(p.status==='已完成')?100:(p.status==='规划中')?10:Math.min(95,Math.round(Math.random()*40+30));
    pp+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>'+p.name+'</span><span style="color:var(--textL)">'+pct+'%</span></div><div class="progress-bar"><div class="fill" style="width:'+pct+'%"></div></div></div>';
  });
  document.getElementById('projProgress').innerHTML=pp||'<p style="color:var(--textL);font-size:13px">暂无数据</p>';

  var ds='';var soon=ts.filter(function(t){return t.status!=='已完成'&&new Date(t.due)<=new Date(Date.now()+7*864e5)});
  soon.forEach(function(t){ds+='<div style="padding:8px 0;border-bottom:1px solid var(--bg);font-size:13px"><span class="badge badge-red" style="margin-right:6px">!</span>'+t.name+'<span style="color:var(--textL);float:right">'+t.due+'</span></div>';});
  document.getElementById('dueSoon').innerHTML=ds||'<p style="color:var(--textL);font-size:13px">暂无即将到期任务 ✅</p>';
}

// ===== 项目列表 =====
var editProjId=null;
function renderProjects(){
  var q=(document.getElementById('projSearch')?.value||'').toLowerCase();
  var ps=q?DATA.projects.filter(function(p){return p.name.toLowerCase().includes(q)||p.owner.includes(q)}):DATA.projects;
  var h='';ps.forEach(function(p){
    var st=p.status,bg='badge-blue';if(st==='已完成')bg='badge-green';else if(st==='暂停')bg='badge-red';
    var taskCount=DATA.tasks.filter(function(t){return t.pid===p.id}).length;
    var pct=st==='已完成'?100:st==='规划中'?0:Math.round(taskCount?DATA.tasks.filter(function(t){return t.pid===p.id&&t.status==='已完成'}).length/taskCount*100:0);
    h+='<tr><td><strong>'+p.name+'</strong></td><td><span class="badge '+bg+'">'+st+'</span></td><td>'+p.owner+'</td><td>'+p.start+'</td><td>'+p.end+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress-bar" style="flex:1"><div class="fill" style="width:'+pct+'%"></div></div><span style="font-size:11px;color:var(--textL)">'+pct+'%</span></div></td><td><button class="btn btn-sm" onclick="openProjModal(\''+p.id+'\')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteProj(\''+p.id+'\')">删除</button></td></tr>';
  });
  document.getElementById('projTable').innerHTML=h||'<tr><td colspan="7" style="text-align:center;color:var(--textL);padding:32px">暂无项目，点击"新建项目"开始</td></tr>';
}

function openProjModal(id){
  editProjId=id||null;var p=id?DATA.projects.find(function(x){return x.id===id}):{name:'',status:'规划中',owner:'',start:'',end:'',desc:''};
  var h='<h2>'+(id?'编辑项目':'新建项目')+'</h2>';
  h+='<div class="field"><label>项目名称</label><input id="mfName" value="'+p.name+'"></div>';
  h+='<div class="field"><label>状态</label><select id="mfStatus"><option '+(p.status==='规划中'?'selected':'')+'>规划中</option><option '+(p.status==='进行中'?'selected':'')+'>进行中</option><option '+(p.status==='已完成'?'selected':'')+'>已完成</option><option '+(p.status==='暂停'?'selected':'')+'>暂停</option></select></div>';
  h+='<div class="field"><label>负责人</label><input id="mfOwner" value="'+p.owner+'"></div>';
  h+='<div class="field"><label>开始日期</label><input type="date" id="mfStart" value="'+p.start+'"></div>';
  h+='<div class="field"><label>截止日期</label><input type="date" id="mfEnd" value="'+p.end+'"></div>';
  h+='<div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveProj()">保存</button></div>';
  showModal(h);
}

function saveProj(){
  var d={name:document.getElementById('mfName').value,status:document.getElementById('mfStatus').value,owner:document.getElementById('mfOwner').value,start:document.getElementById('mfStart').value,end:document.getElementById('mfEnd').value};
  if(editProjId){var p=DATA.projects.find(function(x){return x.id===editProjId});var k;for(k in d)p[k]=d[k]}
  else{DATA.projects.push(Object.assign({id:'p'+Date.now()},d))}
  save();closeModal();renderProjects();renderDash();renderKanban();renderGantt();
}

function deleteProj(id){if(confirm('确定删除此项目？')){DATA.projects=DATA.projects.filter(function(p){return p.id!==id});DATA.tasks=DATA.tasks.filter(function(t){return t.pid!==id});save();renderProjects();renderDash()}}

// ===== 任务看板 =====
var editTaskId=null;
function renderKanban(){
  var sel=document.getElementById('kanbanProj'),ps=DATA.projects;
  sel.innerHTML=ps.map(function(p){return'<option value="'+p.id+'">'+p.name+'</option>'}).join('');
  var pid=sel.value||(ps[0]&&ps[0].id);if(!pid){document.getElementById('kanbanBoard').innerHTML='';return}
  var ts=DATA.tasks.filter(function(t){return t.pid===pid});
  var cols={status:['待开始','进行中','已完成'],titles:['⏳ 待开始','🔄 进行中','✅ 已完成']};
  var h='';cols.status.forEach(function(st,i){
    var items=ts.filter(function(t){return t.status===st});
    h+='<div class="kanban-col"><h3>'+cols.titles[i]+' <span class="count">'+items.length+'</span></h3>';
    items.forEach(function(t){
      var pr=t.priority;pCls='p-low';if(pr==='high')pCls='p-high';else if(pr==='medium')pCls='p-medium';
      h+='<div class="kanban-item" draggable="true" data-tid="'+t.id+'"><div class="item-title">'+t.name+'</div><div class="item-meta"><span class="item-priority '+pCls+'"></span>'+t.assignee+' · '+t.due+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('kanbanBoard').innerHTML=h;
}

function openTaskModal(id){
  editTaskId=id||null;var t=id?DATA.tasks.find(function(x){return x.id===id}):{pid:'',name:'',status:'待开始',priority:'medium',assignee:'',due:''};
  var h='<h2>'+(id?'编辑任务':'新建任务')+'</h2>';
  h+='<div class="field"><label>所属项目</label><select id="mfPid">'+DATA.projects.map(function(p){return'<option value="'+p.id+'"'+(t.pid===p.id?' selected':'')+'>'+p.name+'</option>'}).join('')+'</select></div>';
  h+='<div class="field"><label>任务名称</label><input id="mfTName" value="'+t.name+'"></div>';
  h+='<div class="field"><label>状态</label><select id="mfTStatus"><option '+(t.status==='待开始'?'selected':'')+'>待开始</option><option '+(t.status==='进行中'?'selected':'')+'>进行中</option><option '+(t.status==='已完成'?'selected':'')+'>已完成</option></select></div>';
  h+='<div class="field"><label>优先级</label><select id="mfPri"><option value="low"'+(t.priority==='low'?' selected':'')+'>低</option><option value="medium"'+(t.priority==='medium'?' selected':'')+'>中</option><option value="high"'+(t.priority==='high'?' selected':'')+'>高</option></select></div>';
  h+='<div class="field"><label>负责人</label><input id="mfAssignee" value="'+t.assignee+'"></div>';
  h+='<div class="field"><label>截止日期</label><input type="date" id="mfDue" value="'+t.due+'"></div>';
  h+='<div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTask()">保存</button></div>';
  showModal(h);
}

function saveTask(){
  var d={pid:document.getElementById('mfPid').value,name:document.getElementById('mfTName').value,status:document.getElementById('mfTStatus').value,priority:document.getElementById('mfPri').value,assignee:document.getElementById('mfAssignee').value,due:document.getElementById('mfDue').value};
  if(editTaskId){var t=DATA.tasks.find(function(x){return x.id===editTaskId});var k;for(k in d)t[k]=d[k]}
  else{DATA.tasks.push(Object.assign({id:'t'+Date.now()},d))}
  save();closeModal();renderKanban();renderGantt();renderDash();
}

// ===== 甘特图 =====
function renderGantt(){
  var sel=document.getElementById('ganttProj'),ps=DATA.projects;
  sel.innerHTML=ps.map(function(p){return'<option value="'+p.id+'">'+p.name+'</option>'}).join('');
  var pid=sel.value||(ps[0]&&ps[0].id);
  var ts=pid?DATA.tasks.filter(function(t){return t.pid===pid}):[];
  if(!ts.length){document.getElementById('ganttChart').innerHTML='<p style="text-align:center;color:var(--textL);padding:32px">暂无任务数据</p>';return}
  var dates=ts.map(function(t){return new Date(t.due)}).concat(ts.map(function(t){return new Date(t.start||t.due)}));
  var minD=new Date(Math.min.apply(null,dates.map(function(d){return d.getTime()})));minD.setDate(1);
  var maxD=new Date(Math.max.apply(null,dates.map(function(d){return d.getTime()})));maxD.setMonth(maxD.getMonth()+1);maxD.setDate(1);
  var totalDays=Math.round((maxD-minD)/(864e5));
  var months=[],d=new Date(minD);
  while(d<maxD){months.push(d.getFullYear()+'年'+(d.getMonth()+1)+'月');d.setMonth(d.getMonth()+1)}
  var h='<div class="gantt-header">'+months.map(function(m){return'<div class="gantt-month">'+m+'</div>'}).join('')+'</div>';
  ts.forEach(function(t){
    var start=t.start?new Date(t.start):new Date(t.due);start.setDate(start.getDate()-3);
    var end=new Date(t.due);
    var off=Math.round((start-minD)/(864e5))/totalDays*100;
    var w=Math.max(2,Math.round((end-start)/(864e5))/totalDays*100);
    var color='var(--accent)';if(t.status==='已完成')color='var(--green)';else if(t.priority==='high')color='var(--red)';
    h+='<div class="gantt-row"><div class="gantt-label">'+t.name+'</div><div class="gantt-track"><div class="gantt-bar" style="left:'+off+'%;width:'+w+'%;background:'+color+'">'+t.name+'</div></div></div>';
  });
  document.getElementById('ganttChart').innerHTML=h;
}

// ===== 待办 =====
function renderTodos(){
  var h='';DATA.todos.forEach(function(t,i){
    h+='<li class="'+(t.done?'done':'')+'"><input type="checkbox"'+(t.done?' checked':'')+' onchange="toggleTodo('+i+')"><span class="text">'+t.text+'</span><span class="del" onclick="deleteTodo('+i+')">×</span></li>';
  });
  document.getElementById('todoList').innerHTML=h||'<li style="color:var(--textL);justify-content:center">暂无待办</li>';
}

function addTodo(){
  var inp=document.getElementById('todoInput'),v=inp.value.trim();if(!v)return;
  DATA.todos.push({id:'td'+Date.now(),text:v,done:false});save();inp.value='';renderTodos();
}
function toggleTodo(i){DATA.todos[i].done=!DATA.todos[i].done;save();renderTodos()}
function deleteTodo(i){DATA.todos.splice(i,1);save();renderTodos()}
